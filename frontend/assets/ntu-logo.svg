<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Outer Glow & Base -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="2.5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Academic Shield Shape -->
  <path d="M60 48 H140 C140 48 142 98 100 138 C58 98 60 48 60 48 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="3" 
        filter="url(#shadow)"/>

  <!-- Open Book Symbol (Academia) -->
  <path d="M74 108 C84 104 94 105 100 110 C106 105 116 104 126 108 C126 94 116 90 100 95 C84 90 74 94 74 108 Z" 
        fill="#f8fafc" 
        opacity="0.95" />
  <line x1="100" y1="95" x2="100" y2="110" stroke="#be123c" stroke-width="1.5" />

  <!-- Graduation Cap (Top emblem) -->
  <polygon points="100,56 128,68 100,78 72,68" fill="url(#goldGrad)"/>
  <path d="M82 73 V84 C82 89 118 89 118 84 V73" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="128" cy="68" r="2.5" fill="#fef08a"/>
  <path d="M128 70 V82" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stylized "NTU" Monogram -->
  <text x="100" y="103" 
        text-anchor="middle" 
        font-family="'Inter', 'Segoe UI', Arial, sans-serif" 
        font-weight="900" 
        font-size="20" 
        letter-spacing="2"
        fill="#ffffff">NTU</text>

  <!-- Educational Laurels / Stars below -->
  <circle cx="100" cy="126" r="3" fill="url(#goldGrad)" />
  <circle cx="90" cy="123" r="2.2" fill="url(#goldGrad)" opacity="0.85"/>
  <circle cx="110" cy="123" r="2.2" fill="url(#goldGrad)" opacity="0.85"/>

  <!-- Subtitle Ribbon: NGUYEN TRAI UNIVERSITY -->
  <path d="M42 152 Q100 170 158 152" fill="none" stroke="none" id="arcText"/>
  <text font-family="'Inter', Arial, sans-serif" font-size="8" font-weight="700" fill="#93c5fd" letter-spacing="2">
    <textPath href="#arcText" startOffset="50%" text-anchor="middle">
      ĐẠI HỌC NGUYỄN TRÃI
    </textPath>
  </text>
  <text x="100" y="174" 
        text-anchor="middle" 
        font-family="'Inter', Arial, sans-serif" 
        font-size="8" 
        font-weight="600" 
        letter-spacing="3" 
        fill="#f59e0b">EDUBOT • AI</text>
</svg>
